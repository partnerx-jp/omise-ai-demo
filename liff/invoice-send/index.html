<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://partnerx-jp.github.io; connect-src 'self' https://partnerx-jp.github.io https://api.line.me https://*.line.me https://*.line-apps.com https://*.line-scdn.net;">
  <!-- ポップアップの滞在時間を最短化：外部CSSなし・preconnectでSDK/API接続を先行 -->
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="preconnect" href="https://api.line.me" crossorigin>
  <title>お店のAIワーカー</title>
  <style>
    body { margin: 0; background: #fff; font-family: -apple-system, "Hiragino Sans", sans-serif; }
    /* 通常は何も表示しない（送信できたら即closeWindow）。エラー時のみJSで文言を出す */
    #err { display: none; text-align: center; padding: 40px 20px; }
    #err h2 { font-size: 15px; margin: 0 0 6px; color: #1A1A1A; }
    #err p { font-size: 12px; color: #5C6169; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <div id="err"><h2>送信できませんでした</h2><p id="errmsg"></p></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2010700075-zQ4sAdpF";
    const IMG = "https://partnerx-jp.github.io/omise-ai-demo/assets/invoice-sample.png";

    function fail(msg){
      document.getElementById("errmsg").textContent = msg;
      document.getElementById("err").style.display = "block";
    }

    (async () => {
      try {
        if (!LIFF_ID || !window.liff) { fail("LIFF IDが未設定です（登録待ち）"); return; }
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isInClient()) { fail("LINEアプリ内のトーク画面から開いてください"); return; }
        // オーナー本人のメッセージとして請求書画像を送信（トーク右側に表示される）
        await liff.sendMessages([
          { type: "image", originalContentUrl: IMG, previewImageUrl: IMG }
        ]);
        liff.closeWindow();
      } catch (e) {
        fail((e && e.message) || "不明なエラー");
      }
    })();
  </script>
</body>
</html>
